# =====================================================
# PostgreSQL Configuration for Lada CMS
# =====================================================

# Server Configuration
server.port=8080

# Thymeleaf Configuration
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# File upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/lada_cms_pg
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=lada_user
spring.datasource.password=LadaCMS2025

# Connection pool settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
# PostgreSQL connection test query
spring.datasource.hikari.connection-test-query=SELECT 1

# JPA/Hibernate Configuration for PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=10
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Hibernate naming strategy (важно для совместимости)
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# JPA properties
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# Error Handling Configuration
server.error.whitelabel.enabled=false
server.error.path=/error
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=never
server.error.include-exception=false

# Logging Configuration
logging.level.com.community.cms=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springframework.transaction=TRACE
logging.level.org.springframework.orm.jpa=DEBUG
logging.level.org.hibernate.engine.transaction.internal=DEBUG

# File storage configuration (сохраняем тот же путь)
file.upload-dir=/data/uploads
spring.web.resources.static-locations=classpath:/static/,file:/data/uploads/

# Liquibase disabled
spring.liquibase.enabled=false

# Actuator (для health checks)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# =====================================================
# Fix for PostgreSQL Large Objects issue
# =====================================================

# Отключаем auto-commit (необходимо для работы с TEXT полями)
spring.datasource.hikari.auto-commit=false

# Формат дат для корректного отображения в формах
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss
spring.jackson.time-zone=Europe/Moscow

# JPA формат дат
spring.jpa.properties.hibernate.jdbc.time_zone=Europe/Moscow