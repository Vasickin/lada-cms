<!DOCTYPE html>
<!--
    NAVIGATION FRAGMENT - FIXED VERSION / ФРАГМЕНТ НАВИГАЦИИ - ИСПРАВЛЕННАЯ ВЕРСИЯ
    Fixed: Removed problematic httpServletRequest expressions causing 500 errors
    Исправлено: Убраны проблемные выражения httpServletRequest вызывающие ошибки 500

    Solution: Use simpler approach for active states without httpServletRequest
    Решение: Использовать более простой подход для активных состояний без httpServletRequest
-->
<html lang="ru" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<!--
    MAIN NAVIGATION COMPONENT - SIMPLIFIED / ОСНОВНОЙ КОМПОНЕНТ НАВИГАЦИИ - УПРОЩЕННЫЙ
    Fixed version without httpServletRequest dependency for fragment compatibility
    Исправленная версия без зависимости от httpServletRequest для совместимости фрагментов
-->
<nav class="navbar navbar-expand-lg navbar-light navbar-custom fixed-top" th:fragment="main-navigation">
    <div class="container">
        <!--
            BRAND LOGO AND NAME / ЛОГОТИП И НАЗВАНИЕ БРЕНДА
            Organization branding remains unchanged
            Брендинг организации остается без изменений
        -->
        <a class="navbar-brand logo-brand" href="/" th:href="@{/}">
            <img src="/images/optimized/logo.png"
                 alt="Лада - Общественная организация"
                 class="logo-image"
                 th:onerror="this.style.display='none'; this.nextElementSibling.style.display='inline-block'">
            <span style="color: var(--primary-800); display: none;">🏛️ Лада</span>
            <span class="me-1">Лада</span>
        </a>

        <!--
            MOBILE MENU TOGGLE / ПЕРЕКЛЮЧАТЕЛЬ МОБИЛЬНОГО МЕНЮ
            Hamburger menu button remains unchanged
            Кнопка гамбургер-меню остается без изменений
        -->
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Переключить навигацию">
            <span class="navbar-toggler-icon"></span>
        </button>

        <!--
            NAVIGATION MENU ITEMS - SIMPLIFIED / ПУНКТЫ НАВИГАЦИОННОГО МЕНЮ - УПРОЩЕННЫЕ
            Fixed: Removed httpServletRequest expressions causing null pointer exceptions
            Исправлено: Убраны выражения httpServletRequest вызывающие исключения null pointer
            Solution: Active states will be handled by JavaScript or server-side logic
            Решение: Активные состояния будут обрабатываться JavaScript или серверной логикой
        -->
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <!--
                    SIMPLIFIED NAVIGATION LINKS / УПРОЩЕННЫЕ НАВИГАЦИОННЫЕ ССЫЛКИ
                    Removed problematic th:classappend with httpServletRequest
                    Убраны проблемные th:classappend с httpServletRequest
                    Active states will be implemented later with JavaScript
                    Активные состояния будут реализованы позже с помощью JavaScript
                -->
                <li class="nav-item">
                    <a class="nav-link fw-semibold" href="/" th:href="@{/}">
                        Главная
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link fw-semibold" href="/about" th:href="@{/about}">
                        О нас
                    </a>
                </li>
                <li class="nav-item dropdown">
                    <a class="nav-link fw-semibold dropdown-toggle" href="#"
                       id="projectsDropdown" role="button"
                       data-bs-toggle="dropdown" aria-expanded="false">
                        Наши проекты
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="projectsDropdown">
                        <!-- All Projects Link / Ссылка на все проекты -->
                        <li>
                            <a class="dropdown-item" href="/projects" th:href="@{/projects}">
                                <i class="bi bi-grid-3x3-gap me-2"></i> Все проекты
                            </a>
                        </li>
                        <li><hr class="dropdown-divider"></li>

                        <!-- Category Links / Ссылки на категории -->
                        <!--
                            This will be dynamically populated from server-side
                            Это будет динамически заполняться с серверной стороны
                        -->
                        <li th:each="category : ${projectCategories}">
                            <a class="dropdown-item"
                               th:href="@{/projects(category=${category})}"
                               th:text="${category}">
                                Категория
                            </a>
                        </li>

                        <!-- Fallback if no categories / Запасной вариант, если нет категорий -->
                        <li th:unless="${projectCategories != null and !projectCategories.isEmpty()}">
                            <a class="dropdown-item text-muted disabled" href="#">
                                <i class="bi bi-info-circle me-2"></i> Нет доступных категорий
                            </a>
                        </li>
                    </ul>
                </li>

                <li class="nav-item">
                    <a class="nav-link fw-semibold" href="/gallery" th:href="@{/gallery}">
                        Галерея
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link fw-semibold" href="/patrons" th:href="@{/patrons}">
                        Меценатам
                    </a>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link fw-semibold" href="/team" th:href="@{/team}">
                        Наша команда
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link fw-semibold" href="/contact" th:href="@{/contact}">
                        Контакты
                    </a>
                </li>
                <!--
                    ADMIN DASHBOARD LINK - WORKS CORRECTLY / ССЫЛКА НА ПАНЕЛЬ УПРАВЛЕНИЯ - РАБОТАЕТ КОРРЕКТНО
                    Spring Security integration works fine with sec:authorize
                    Интеграция Spring Security работает корректно с sec:authorize
                    This was not the source of the problem
                    Это не было источником проблемы
                -->
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="nav-link fw-semibold text-success" href="/admin" th:href="@{/admin}">
                        <span class="me-1">⚙️</span>
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- Optional: JavaScript for better UX / Дополнительно: JavaScript для лучшего UX -->
<script th:inline="javascript">
    /*<![CDATA[*/
    document.addEventListener('DOMContentLoaded', function() {
        // Highlight active category in dropdown / Подсветка активной категории в выпадающем меню
        const currentUrl = window.location.pathname + window.location.search;
        const dropdownItems = document.querySelectorAll('.dropdown-item');

        dropdownItems.forEach(item => {
            if (item.href && currentUrl.includes('/projects')) {
                const urlParams = new URLSearchParams(window.location.search);
                const currentCategory = urlParams.get('category');
                const itemCategory = new URL(item.href).searchParams.get('category');

                if (currentUrl === item.href ||
                    (currentCategory && currentCategory === itemCategory)) {
                    item.classList.add('active');
                    item.innerHTML = '<i class="bi bi-check-circle me-2"></i>' + item.textContent;
                }
            }
        });

        // Mobile menu close on click / Закрытие мобильного меню при клике
        const navbarCollapse = document.getElementById('navbarNav');
        const dropdownToggle = document.getElementById('projectsDropdown');

        if (navbarCollapse) {
            navbarCollapse.addEventListener('click', function(e) {
                if (e.target.classList.contains('dropdown-item')) {
                    const bsCollapse = new bootstrap.Collapse(navbarCollapse);
                    bsCollapse.hide();
                }
            });
        }
    });
    /*]]>*/
</script>
