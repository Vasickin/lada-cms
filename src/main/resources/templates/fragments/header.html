<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<!--
    HEADER FRAGMENT / ФРАГМЕНТ ХЕДЕРА
    Reusable HTML head section with meta tags and styles / Переиспользуемая секция HTML head с мета-тегами и стилями
-->
<head th:fragment="html-head(title)">
    <!--
        META AND BASIC SETUP / МЕТАДАННЫЕ И БАЗОВАЯ НАСТРОЙКА
        Character set, viewport, and page title / Кодировка, вьюпорт и заголовок страницы
    -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' - Общественная организация Лада'">Общественная организация Лада</title>


    <!-- ПРЕДЗАГРУЗКА БАННЕРА - ТОЛЬКО ЭТО ДОБАВЛЯЕМ -->
    <link rel="preload" as="image"
          href="/images/optimized/header-bg.jpg"
          media="(min-width: 768px)"
          fetchpriority="high">
    <link rel="preload" as="image"
          href="/images/optimized/logo@2x.png"
          media="(max-width: 767px)"
          fetchpriority="high">

    <!--
        META DESCRIPTION AND KEYWORDS / МЕТА-ОПИСАНИЕ И КЛЮЧЕВЫЕ СЛОВА
        SEO optimization for search engines / SEO оптимизация для поисковых систем
    -->
    <meta name="description" content="Общественная организация Лада - развитие гражданского общества и поддержка социальных инициатив">
    <meta name="keywords" content="общественная организация, социальные проекты, гражданское общество, волонтерство">

    <!-- ========================================================== -->
    <!-- FAVICONS - ИКОНКИ САЙТА ДЛЯ ВКЛАДОК И МОБИЛЬНЫХ УСТРОЙСТВ -->
    <!-- ========================================================== -->

    <!-- ОСНОВНОЙ НАБОР (работает везде) -->
    <link rel="shortcut icon" href="/images/favicons/favicon.ico" type="image/x-icon">
    <link rel="icon" href="/images/favicons/favicon.ico?v=2">

    <!-- PNG версии для современных браузеров -->
    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/images/favicons/favicon-16x16.png">

    <!-- Для Apple устройств -->
    <link rel="apple-touch-icon" sizes="180x180" href="/images/favicons/apple-touch-icon.png">

    <!-- Для Android PWA -->
    <link rel="icon" type="image/png" sizes="192x192" href="/images/favicons/android-chrome-192x192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/images/favicons/android-chrome-512x512.png">

    <!-- МАНИФЕСТ (обязательно для PWA и некоторых браузеров) -->
    <link rel="manifest" href="/images/favicons/site.webmanifest">

    <!-- Цвета темы -->
    <meta name="theme-color" content="#1d4ed8">
    <meta name="msapplication-TileColor" content="#1d4ed8">

    <!-- СПЕЦИАЛЬНО ДЛЯ ЯНДЕКС.БРАУЗЕРА -->
    <meta name="yandex-tableau-widget" content="logo=/images/favicons/favicon-32x32.png, color=#1d4ed8">

    <!-- ========================================================== -->
    <!-- КОНЕЦ FAVICONS -->
    <!-- ========================================================== -->

    <!--
        BOOTSTRAP 5 CSS / БИБЛИОТЕКА BOOTSTRAP 5
        Using CDN for consistent styling / Используем CDN для единообразного стиля
    -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!--
        GOOGLE FONTS / ШРИФТЫ GOOGLE
        Using Inter font for modern typography / Используем шрифт Inter для современной типографики
    -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!--
        OUR DESIGN SYSTEM CSS / НАША CSS ДИЗАЙН-СИСТЕМА
        Custom design system with variables and components / Пользовательская дизайн-система с переменными и компонентами
    -->
    <link href="/css/design-system.css" rel="stylesheet">
</head>
